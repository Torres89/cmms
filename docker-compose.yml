name: atlas-cmms
services:
  postgres:
    # pgvector's image, not postgres:16-alpine. This is a musl -> glibc change,
    # which changes text collation: do NOT start it on a data directory that was
    # initialised by the Alpine image. Dump and restore instead.
    image: pgvector/pgvector:pg16
    container_name: atlas_db
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PWD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: atlas-cmms-backend:local
    container_name: atlas-cmms-backend
    depends_on:
      - postgres
      - minio
    environment:
      DB_URL: postgres/atlas
      DB_USER: ${POSTGRES_USER}
      DB_PWD: ${POSTGRES_PWD}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      FASTSPRING_PWD: ${FASTSPRING_PWD}
      FASTSPRING_USER: ${FASTSPRING_USER}
      PUBLIC_FRONT_URL: ${PUBLIC_FRONT_URL}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME}
      GCP_JSON: ${GCP_JSON}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      MAIL_RECIPIENTS: ${MAIL_RECIPIENTS}
      SMTP_PWD: ${SMTP_PWD}
      SMTP_USER: ${SMTP_USER}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: atlas-bucket
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      STORAGE_TYPE: ${STORAGE_TYPE:-minio} #gcp|minio|s3|local
      PUBLIC_MINIO_ENDPOINT: ${PUBLIC_MINIO_ENDPOINT:-http://localhost:9000}
      # S3 / Cloudflare R2 (STORAGE_TYPE=s3)
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_PATH_STYLE: ${STORAGE_S3_PATH_STYLE:-true}
      # Filesystem (STORAGE_TYPE=local) — self-hosted tier
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/data/files}
      STORAGE_LOCAL_SIGNING_KEY: ${STORAGE_LOCAL_SIGNING_KEY:-}
      STORAGE_INLINE_MAX_BYTES: ${STORAGE_INLINE_MAX_BYTES:-33554432}
      # Shared secret for service-to-service calls from the agent
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://ingest-worker:8002}
      JAVA_OPTS: ${API_JAVA_OPTS:--XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25}
      INVITATION_VIA_EMAIL: ${INVITATION_VIA_EMAIL:-false}
      ENABLE_EMAIL_NOTIFICATIONS: ${ENABLE_EMAIL_NOTIFICATIONS:-false}
      ENABLE_SSO: ${ENABLE_SSO:-false}
      OAUTH2_PROVIDER: ${OAUTH2_PROVIDER}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      LICENSE_KEY: ${LICENSE_KEY:-}
      LICENSE_FINGERPRINT_REQUIRED: ${LICENSE_FINGERPRINT_REQUIRED:-true}
      ALLOWED_ORGANIZATION_ADMINS: ${ALLOWED_ORGANIZATION_ADMINS:-}
      LOGO_PATHS: ${LOGO_PATHS}
      CUSTOM_COLORS: ${CUSTOM_COLORS}
      BRAND_CONFIG: ${BRAND_CONFIG}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET_KEY: ${PADDLE_WEBHOOK_SECRET_KEY:-}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      ENABLE_CORS: ${ENABLE_CORS:-true}
      KEYGEN_PRODUCT_TOKEN: ${KEYGEN_PRODUCT_TOKEN:-}
      MAIL_TYPE: ${MAIL_TYPE:-smtp}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_CONTACT_LIST_ID: ${SENDGRID_CONTACT_LIST_ID:-}
      DISABLE_PUBLIC_REGISTRATION: ${DISABLE_PUBLIC_REGISTRATION:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_COMPANY_NAME: ${ADMIN_COMPANY_NAME:-Default Company}
    volumes:
      - ./logo:/app/static/images
      - file_data:/data/files
    ports:
      - "8080:8080"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: atlas-cmms-frontend:local
    container_name: atlas-cmms-frontend
    environment:
        API_URL: ${PUBLIC_API_URL}
        GOOGLE_KEY: ${GOOGLE_KEY:- }
        GOOGLE_TRACKING_ID: ${GOOGLE_TRACKING_ID:- }
        MUI_X_LICENSE: ${MUI_X_LICENSE:- }
        INVITATION_VIA_EMAIL: ${INVITATION_VIA_EMAIL:-false}
        CLOUD_VERSION: ${CLOUD_VERSION:-false}
        NODE_ENV: production
        ENABLE_SSO: ${ENABLE_SSO:-false}
        OAUTH2_PROVIDER: ${OAUTH2_PROVIDER:- }
        LOGO_PATHS: ${LOGO_PATHS:- }
        CUSTOM_COLORS: ${CUSTOM_COLORS:- }
        BRAND_CONFIG: ${BRAND_CONFIG:- }
        DEMO_LINK: ${DEMO_LINK:- }
        PADDLE_SECRET_TOKEN: ${PADDLE_SECRET_TOKEN:- }
        PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
        AGENT_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - api
      - agent
  agent:
    build:
      context: ./cmms-agent
      dockerfile: Dockerfile
    image: atlas-cmms-agent:local
    container_name: atlas-cmms-agent
    env_file:
      - ./cmms-agent/.env
    environment:
      - CMMS_API_URL=http://api:8080
      - CMMS_FRONT_URL=${PUBLIC_FRONT_URL:-http://localhost:3000}
      # Chat sessions, the tool audit trail and LLM usage metering live in the
      # same Postgres the API uses.
      - DB_URL=postgres:5432/atlas
      - DB_USER=${POSTGRES_USER}
      - DB_PWD=${POSTGRES_PWD}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      # Door 1 — remote MCP server. Must be the public HTTPS URL clients reach.
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-http://localhost:8001}
    ports:
      - "8001:8001"
    depends_on:
      - api
      - postgres
  ingest-worker:
    build:
      context: ./ingest-worker
      dockerfile: Dockerfile
    image: atlas-cmms-ingest:local
    container_name: atlas-cmms-ingest
    environment:
      - WORKER_ROLE=${WORKER_ROLE:-both}
      - DB_URL=postgres:5432/atlas
      - DB_USER=${POSTGRES_USER}
      - DB_PWD=${POSTGRES_PWD}
      - STORAGE_TYPE=${STORAGE_TYPE:-minio}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_BUCKET=atlas-bucket
      - MINIO_ACCESS_KEY=${MINIO_USER}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT:-}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY:-}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY:-}
      - STORAGE_LOCAL_PATH=/data/files
    volumes:
      # Model weights survive container restarts instead of being re-downloaded.
      - model_cache:/models
      - file_data:/data/files
    ports:
      # Loopback only. /embed and /ocr take no credentials, and the only caller
      # is the API over the compose network (EMBEDDING_URL=http://ingest-worker:8002),
      # so publishing this on 0.0.0.0 would put unauthenticated OCR and embedding
      # on the public interface. Compose merges `ports` across files rather than
      # replacing them, so this has to be right here, not overridden in prod.
      - "127.0.0.1:8002:8002"
    depends_on:
      - postgres

  # Optional per customer, and gated on physical access to a machine. Start it
  # with: docker compose --profile telemetry up -d
  telemetry-collector:
    build:
      context: ./telemetry-collector
      dockerfile: Dockerfile
    image: atlas-cmms-telemetry:local
    container_name: atlas-cmms-telemetry
    profiles: ["telemetry"]
    environment:
      - CMMS_API_URL=http://api:8080
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - COLLECTOR_TICK_SECONDS=${COLLECTOR_TICK_SECONDS:-60}
      - COLLECTOR_DEFAULT_POLL_MINUTES=${COLLECTOR_DEFAULT_POLL_MINUTES:-60}
    depends_on:
      - api

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: atlas_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server --address ":9000" --console-address ":9001" /data

volumes:
  postgres_data:
  minio_data:
  file_data:
  model_cache:
