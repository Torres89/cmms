server {
  listen 3000;
  root /usr/share/nginx/html;

  # The service worker and everything that says which bundle or API to load
  # must never be cached by the browser, or a deploy is invisible until the
  # cache expires. The service worker handles offline itself.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }
  location = /env.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Content-hashed file names: safe to cache forever
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app: any other path is the app shell
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
